<div class="search-wrapper" id="site-search" role="search" aria-hidden="true">
    <div class="search-form">
        <label class="visually-hidden" for="search-field">Search articles</label>
        <input id="search-field" type="search" class="search-field" placeholder="{{ site.translations.text.search | default: 'Search' }}" autocomplete="off">
        <button class="search-close" type="button" aria-label="Close search"><svg class="icon-remove-sign" aria-hidden="true"><use xlink:href="#icon-close"></use></svg></button>
        <ul class="search-results search-list" aria-live="polite"></ul>
    </div>
</div>
