<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    {% seo %}

    <!-- Favicon -->
    <link rel="icon" href="{{ '/Favicon.ico' | relative_url }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ '/assets/img/logo.png' | relative_url }}">
    <meta name="theme-color" content="#141414">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | prepend: site.baseurl }}?v={{ site.time | date: '%s' }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

    <!-- Include extra styles -->
    {% include extra-css.html %}

    <!-- JavaScript enabled/disabled -->
    <script>
        document.querySelector('html').classList.remove('no-js');
    </script>
    <script defer data-domain="harsim.ca" src="https://plausible.io/js/script.file-downloads.hash.outbound-links.pageview-props.revenue.tagged-events.js"></script>
    <script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>
</head>
