name: Validate Jekyll site

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "lab/**"
      - "docs/tests/live-lab.test.mjs"
      - "_config.yml"
      - "_layouts/home.html"
      - "privacy-policy.md"
      - ".github/workflows/jekyll.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Check live lab game and optional IP lookup
        run: node --test docs/tests/live-lab.test.mjs
      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
